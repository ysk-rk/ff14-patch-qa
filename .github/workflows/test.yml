# push と pull request のたびに、自動テストと画面のチェックを流す
name: test

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-test.txt

      # テストに必要なのは HTML の解析と pytest だけ（埋め込みモデルや Gemini は使わない）
      - run: pip install -r requirements-test.txt

      - run: python -m pytest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # package-lock.json のとおりに入れる
      - run: npm ci

      - run: npm run lint

      # 型のエラーもここで見つかる（tsc -b）
      - run: npm run build